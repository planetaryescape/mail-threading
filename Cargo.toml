[package]
name = "mail-threading"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/planetaryescape/mail-threading"
homepage = "https://github.com/planetaryescape/mail-threading"
documentation = "https://docs.rs/mail-threading"
description = "Spec-aligned client-side email threading using RFC 5256/JWZ references."
readme = "README.md"
keywords = ["email", "threading", "jwz", "imap", "rfc5256"]
categories = ["algorithms", "email"]
include = [
    "Cargo.toml",
    "README.md",
    "src/**",
    "testdata/**",
    "tests/**",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
